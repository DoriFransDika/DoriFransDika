<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="Dori Frans Dika - Full-Stack Developer, Informatics Engineering Graduate" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="0.5" stop-color="#123B68"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .name { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; font-size: 76px; fill: #FFFFFF; letter-spacing: -1px; }
      .role { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 500; font-size: 28px; fill: #BFDBFE; }
      .pill { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 600; font-size: 16px; fill: #DBEAFE; }
      .sym  { font-family: 'Consolas','Courier New',monospace; font-weight: 700; fill: #FFFFFF; }
      .float { animation: float 6s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="330" fill="url(#bg)"/>
  <rect width="1280" height="330" fill="url(#grid)"/>
  <circle cx="1040" cy="150" r="260" fill="url(#glow)"/>

  <!-- faint coding symbols -->
  <text class="sym" x="610" y="70" font-size="64" opacity="0.07">&lt;/&gt;</text>
  <text class="sym" x="40" y="300" font-size="90" opacity="0.06">{ }</text>
  <text class="sym" x="480" y="310" font-size="54" opacity="0.06">;</text>

  <!-- Name -->
  <text class="name" x="70" y="145">Dori Frans Dika</text>
  <text class="role" x="72" y="192">Full-Stack Developer · Informatics Engineering Graduate</text>
  <rect x="72" y="212" width="150" height="4" rx="2" fill="url(#line)"/>

  <!-- pill -->
  <rect x="72" y="244" width="330" height="38" rx="19" fill="#0B1F3A" fill-opacity="0.55" stroke="#93C5FD" stroke-opacity="0.6"/>
  <circle class="pulse" cx="96" cy="263" r="6" fill="#4ADE80"/>
  <text class="pill" x="114" y="269">Open to entry-level opportunities</text>

  <!-- code window -->
  <g class="float">
    <g transform="translate(850,62)" filter="url(#shadow)">
      <rect width="340" height="206" rx="16" fill="#0B1F3A" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <rect width="340" height="38" rx="16" fill="#123B68" fill-opacity="0.85"/>
      <rect y="22" width="340" height="16" fill="#123B68" fill-opacity="0.85"/>
      <circle cx="24" cy="19" r="6" fill="#F87171"/><circle cx="44" cy="19" r="6" fill="#FBBF24"/><circle cx="64" cy="19" r="6" fill="#4ADE80"/>
      <!-- code lines -->
      <rect x="24" y="64"  width="70"  height="10" rx="5" fill="#60A5FA"/>
      <rect x="102" y="64" width="110" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.6"/>
      <rect x="44" y="90"  width="90"  height="10" rx="5" fill="#A78BFA"/>
      <rect x="142" y="90" width="130" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.45"/>
      <rect x="44" y="116" width="60"  height="10" rx="5" fill="#34D399"/>
      <rect x="112" y="116" width="150" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.45"/>
      <rect x="44" y="142" width="110" height="10" rx="5" fill="#60A5FA"/>
      <rect x="162" y="142" width="80" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.45"/>
      <rect x="24" y="168" width="40"  height="10" rx="5" fill="#60A5FA"/>
      <rect class="cursor" x="74" y="164" width="9" height="18" fill="#93C5FD"/>
    </g>
  </g>

  <rect x="0" y="322" width="1280" height="8" fill="url(#line)" opacity="0.9"/>
</svg>
